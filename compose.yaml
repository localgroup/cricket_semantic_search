# Deliberately one container: Django/UI + MongoDB + Qdrant + MCP adapter code.
# The MCP stdio server is launched on demand with `compose exec` so it can be
# connected to an MCP-capable client without exposing a network MCP endpoint.
services:
  cricket-search:
    # Explicit name used by the operational commands in README.md.
    container_name: cricket-search
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MONGODB_URI: mongodb://127.0.0.1:27017
      QDRANT_URL: http://127.0.0.1:6333
      INPUT_FILE: /app/data/cricket_log.txt
      OUTPUT_DIR: /app/output
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,cricket-search
    ports:
      - "8000:8000"
      - "8050:8050"
    volumes:
      - ./output:/app/output
      # Deliberately separate from the standalone cricket-mongodb and
      # cricket-qdrant storage. Never share a database data directory between
      # two running database processes.
      - ./state/combined/mongodb:/var/lib/mongodb
      - ./state/combined/qdrant:/qdrant/storage
      - model_cache:/app/.cache/huggingface
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  model_cache:
