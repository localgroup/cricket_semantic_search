[supervisord]
nodaemon=true
user=root
logfile=/dev/null
pidfile=/tmp/supervisord.pid
loglevel=info

[program:mongodb]
command=/opt/mongodb/mongod --bind_ip 127.0.0.1 --port 27017 --dbpath /var/lib/mongodb --wiredTigerCacheSizeGB 0.5
priority=10
autostart=true
autorestart=true
startsecs=3
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=20

[program:qdrant]
command=/opt/qdrant/qdrant
environment=QDRANT__SERVICE__HOST="0.0.0.0",QDRANT__SERVICE__HTTP_PORT="6333",QDRANT__SERVICE__GRPC_PORT="6334",QDRANT__STORAGE__STORAGE_PATH="/qdrant/storage"
priority=20
autostart=true
autorestart=true
startsecs=3
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=20

[program:web]
directory=/app
command=/usr/local/bin/gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 180
environment=DJANGO_SETTINGS_MODULE="config.settings"
priority=30
autostart=true
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=30

[program:dash]
directory=/app
command=/usr/local/bin/gunicorn dash_app:server --bind 0.0.0.0:8050 --workers 2 --timeout 180
environment=DJANGO_API_URL="http://127.0.0.1:8000"
priority=40
autostart=true
autorestart=true
startsecs=5
startretries=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=30
